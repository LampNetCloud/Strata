name: CI

# Gate cho repo Strata — issue #24.
#
# Trước PR này repo KHÔNG có workflow nào: `gh pr checks` trả "no checks reported",
# nên mọi lệnh test/clippy/fmt chỉ đúng ở máy nào có chạy. Đây là cùng lớp gap đã gặp
# ở VeDataIO/Glint#12 và gói tx-builder của Mosaic.
#
# Thứ tự bật (xem #24): pin toolchain (#29) → sweep fmt (#30) → MỚI bật gate này.
# Bật `fmt --check` trước khi sweep thì mọi PR đỏ oan.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # BẮT BUỘC, không phải tối ưu. Cargo fetch git-dependency bằng **libgit2**, không gọi
  # git CLI — mà `url.<base>.insteadOf` là tính năng của git CLI, libgit2 KHÔNG hiện thực
  # nó. Thiếu cờ này thì bước rewrite bên dưới không có tác dụng và cargo vẫn đi thẳng
  # https tới repo private rồi chết vì auth. Với deploy key (SSH) thì càng bắt buộc:
  # libgit2 không dùng `~/.ssh/config` lẫn ssh-agent của runner. (anh Đức, review #31 điểm 1)
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    name: rust (test · clippy · fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `lampnet-merkle-anchor` kéo từ repo PRIVATE LampNetCloud/Anchor (pin git rev).
      # GITHUB_TOKEN mặc định KHÔNG đọc được repo khác ⇒ phải có khoá đọc riêng.
      # Kiểm sớm + báo rõ, thay vì để cargo fetch chết với lỗi auth khó đọc.
      #
      # Dạng khoá = **deploy key (SSH)**, không phải fine-grained PAT: PAT tối đa 1 năm và
      # gắn vào tài khoản MỘT người (người đó đổi quyền/rời đi là CI gãy), còn deploy key
      # không hết hạn và gắn vào chính repo `Anchor`. Lý do đầy đủ ở
      # `docs/STRATA-S7-CI-REPORT.md §4`; workflow trước đây còn nói PAT là do viết trước
      # khi hướng đó bị rút (anh Đức, review #31 điểm 3).
      - name: Preflight — khoá đọc dep private
        env:
          ANCHOR_DEPLOY_KEY: ${{ secrets.ANCHOR_DEPLOY_KEY }}
        run: |
          if [ -z "$ANCHOR_DEPLOY_KEY" ]; then
            echo "::error::Thiếu secret ANCHOR_DEPLOY_KEY. Cargo.toml pin lampnet-merkle-anchor"
            echo "::error::từ repo private LampNetCloud/Anchor; CI không fetch được nếu không có khoá đọc."
            echo "::error::Cách thêm (cần quyền admin repo — lrybi không có):"
            echo "::error::  1) ssh-keygen -t ed25519 -N '' -f anchor_deploy -C 'Strata CI read-only'"
            echo "::error::  2) dán anchor_deploy.pub vào LampNetCloud/Anchor → Settings → Deploy keys"
            echo "::error::     (KHÔNG tick 'Allow write access')"
            echo "::error::  3) gh secret set ANCHOR_DEPLOY_KEY --repo LampNetCloud/Strata < anchor_deploy"
            exit 1
          fi

      # Rewrite CHỈ cho repo Anchor, không phủ toàn bộ github.com: nếu rewrite ở mức
      # "https://github.com/" thì mọi fetch của mọi step sau đều đi qua khoá này. Hẹp lại
      # thì khoá chỉ được dùng đúng chỗ cần (anh Đức, review #31 điểm 2).
      # Khoá đọc qua `env:` chứ không nội suy `${{ }}` thẳng vào thân script — tránh lọt
      # vào lệnh in ra khi có `set -x`.
      - name: Nạp deploy key đọc LampNetCloud/Anchor
        env:
          ANCHOR_DEPLOY_KEY: ${{ secrets.ANCHOR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ANCHOR_DEPLOY_KEY" > ~/.ssh/anchor_deploy
          chmod 600 ~/.ssh/anchor_deploy
          # Ghim host key của github.com thay vì tin lần-gặp-đầu.
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # IdentitiesOnly=yes: chỉ dùng đúng khoá này, không thử các khoá khác của agent.
          printf '%s\n' \
            'Host github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/anchor_deploy' \
            '  IdentitiesOnly yes' >> ~/.ssh/config
          git config --global \
            url."git@github.com:LampNetCloud/Anchor".insteadOf \
            "https://github.com/LampNetCloud/Anchor"

      # KHÔNG pin toolchain ở đây: rust-toolchain.toml (#29) là nguồn duy nhất.
      # rustup tự cài đúng channel + components khi chạy lệnh cargo đầu tiên.
      - name: Toolchain theo rust-toolchain.toml
        run: rustup show && cargo --version && rustfmt --version

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  submitter:
    name: submitter (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anchor-io/submitter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: anchor-io/submitter/package-lock.json
      - run: npm ci
      # Gói này nằm ngoài Cargo workspace nên không lệnh Rust nào chạm tới nó.
      # Không có job này thì API-drift của Lucid chỉ lộ lúc chạy thật.
      - run: npm run typecheck
      # Đối chiếu metadatum label 1234 với test-vector CHUNG apis/settlement-metadata.json
      # (bên Rust: tests/settlement_fixture.rs). Không có bước này thì TS và Rust trôi
      # khỏi nhau mà không lệnh build nào phát hiện — xem PR #33.
      - run: npm run test:fixture
