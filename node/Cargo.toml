[package]
name = "lampnet-strata-node"
version = "0.1.0"
edition = "2024"
description = "Daemon Strata — lớp I/O + HTTP §3 (Strata-API.md) đứng trước crate lõi THUẦN lampnet-strata."
license = "Apache-2.0"
repository = "https://github.com/LampNetCloud/Strata"

[dependencies]
lampnet-strata = { path = ".." }
# Cắm sink THẬT: Settlement (đọc Blockfrost) + đẩy lô sang cửa Mosaic — xem `sink_config`.
lampnet-anchor-io = { path = "../anchor-io" }
lampnet-merkle-anchor ={ git = "https://github.com/LampNetCloud/Anchor.git", rev = "f864fa3a5d5e0fb159432ed5593af6d470ca1b76" }
ed25519-dalek = "2.0"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rand = "0.8"

[[bin]]
name = "strata-node"
path = "src/bin/strata_node.rs"
