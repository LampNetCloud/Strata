[package]
name = "lampnet-anchor-io"
version = "0.1.0"
edition = "2024"
description = "I/O cho S1 AnchorSink backend Settlement — Blockfrost (đọc on-chain) + MosaicDoorSubmitter (đẩy lô label 1234 sang cửa Mosaic; Mosaic dựng tx). Tách khỏi crate lõi `lampnet-strata` (giữ lõi no-I/O)."
license = "Apache-2.0"

[dependencies]
lampnet-strata = { path = ".." }
hex = "0.4"
# Chữ ký operator trên lô gửi vào cửa Mosaic: blake2b-256 dựng thông điệp
# (`MOSAIC-STRATA-BATCH-v1`), ed25519 ký. Cả hai PHẢI khớp byte-for-byte với
# `VeDataIO/Core: mosaic/l1/src/door.rs::operator_sig_message` — lệch một byte thì
# cửa trả 401 và không có gì nói vì sao.
blake2 = "0.10"
ed25519-dalek = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
