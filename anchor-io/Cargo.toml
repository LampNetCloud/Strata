[package]
name = "lampnet-anchor-io"
version = "0.1.0"
edition = "2024"
description = "I/O cho S1 AnchorSink backend Settlement — Blockfrost (đọc on-chain) + submitter TS Lucid Evolution (build+submit tx metadata label 1234). Tách khỏi crate lõi `lampnet-strata` (giữ lõi no-I/O)."
license = "Apache-2.0"

[dependencies]
lampnet-strata = { path = ".." }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
