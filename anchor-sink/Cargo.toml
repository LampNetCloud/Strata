[package]
name = "lampnet-anchor-sink"
version = "0.1.0"
edition = "2024"
description = "S1 AnchorSink — adapter neo StrataAnchor lên Cardano (backend Settlement: tx metadata label 1234). Spec Strata-API §4 + §8.1."
license = "Apache-2.0"

[dependencies]
lampnet-strata = { path = ".." }
ciborium = "0.2"
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"

[dev-dependencies]
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"
